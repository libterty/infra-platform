# deploy/values-from-ssm.sh fills everything above the "chart settings" line from SSM; the defaults only let
# `helm lint` and `helm template` render without it.

# api or worker. Only the api gets a Service, a TargetGroupBinding and ingress.
component: api

# Namespace that eks-cluster set up the Pod Identity associations for; the chart refuses any other release namespace.
# Empty skips the check.
namespace: ""

image:
  repository: example-api
  tag: latest

# The name comes from eks-cluster (api_service_account, worker_service_account): the Pod Identity association is bound
# to it. A second release of the same workload (a canary) sets create: false and reuses the account.
serviceAccount:
  name: api
  create: true

port: 8080

# Plain environment variables; secrets are ARNs that the application reads with its Pod Identity role.
env: {}

# Terraform owns the target group; the TargetGroupBinding only registers Pods into it. Empty renders no binding.
targetGroupArn: ""

# Fields of application/api_scaling_json or application/worker_scaling_json (design v4 §9).
scaling:
  min_replicas: 1
  max_replicas: 2
  region: ap-northeast-1
  cpu_target_percent: 60
  requests_per_target: 300
  streams_per_replica: 100
  alb_arn_suffix: app/example/0123456789abcdef
  target_group_arn_suffix: targetgroup/example/0123456789ab
  backlog_per_replica: 25000
  metric_namespace: Example/dev
  metric_name: StreamBacklogMax
  dimension_name: Env
  dimension_value: dev

networkPolicy:
  vpcCidr: 10.10.0.0/16
  dnsCidr: 172.20.0.10/32

# ---- chart settings ----

# Pods go to the app node pool of eks-addons, whose NodeClass gives them the app security group.
nodePool: app

resources:
  api:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { memory: 1Gi }
  worker:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 512Mi }

# Ports of the RDS Proxy and Redis inside the VPC, for the egress NetworkPolicy.
dataPorts: [5432, 6379]

# HPA scale-down: 900 s of stable metrics, then at most one Pod per 600 s (design v4 §9).
scaleDown:
  stabilizationWindowSeconds: 900
  podsPerPeriod: 1
  periodSeconds: 600
