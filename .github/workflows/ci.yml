name: CI

# 不給任何雲端憑證。範本的 stack 從 HCP private registry 引用 module（ADR-0004），所以 Validate 這一步讀 repo secret
# TF_TOKEN_APP_TERRAFORM_IO；fork 來的 PR 拿不到 secret，範本的 stack 會在 init 失敗。
on:
  pull_request:
    # release PR 只改 CHANGELOG 與 manifest，合併前人工看 diff（docs/guides/releasing-modules.md）。只改這兩類檔案的 PR
    # 不產生 run：bot 開的 release PR 的 run 會卡在等待核准，PR 一合併、分支一刪就變成沒有 job 的 failure。
    paths-ignore:
      - "**/CHANGELOG.md"
      - ".release-please-manifest.json"
  push:
    branches: [main]
  schedule:
    - cron: "17 1 * * 1" # 每週一 01:17 UTC：registry 與 token 是否還能用
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.15.8"
  TFLINT_VERSION: "v0.64.0"
  TERRAFORM_DOCS_VERSION: "v0.24.0"
  # terraform-docs 只發 sha256、沒有簽章，所以把 linux-amd64 的 hash 寫死在這裡比對。
  TERRAFORM_DOCS_SHA256: "9005daf969de0b50134493a2c00078b49f5f5b39d021cda7c89bf4d4f3d776d3"

jobs:
  # One full run took 32 minutes on one runner (73 modules, 5 templates, 2026-10-25); 4 shards run it in parallel.
  # Each shard repeats fmt and the static rules (a minute or two) and validates every 4th directory.
  validate-shard:
    name: validate (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PR 檢出的是 merge commit，第一個 parent 就是 base branch；Validate 拿它來算這個 PR 改了哪些目錄。
          fetch-depth: 2

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      # Lints the local Helm charts shipped in modules (scripts/validate.sh skips them when helm is missing).
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/plugins
          key: tf-plugins-${{ runner.os }}-${{ hashFiles('**/versions.tf', '**/.terraform.lock.hcl') }}
          restore-keys: tf-plugins-${{ runner.os }}-

      # S11 用 terraform-docs 檢查 module README 的輸入／輸出表。
      - name: Install terraform-docs
        run: |
          f="terraform-docs-${TERRAFORM_DOCS_VERSION}-linux-amd64.tar.gz"
          curl -sSfLo "$RUNNER_TEMP/$f" "https://github.com/terraform-docs/terraform-docs/releases/download/${TERRAFORM_DOCS_VERSION}/$f"
          echo "${TERRAFORM_DOCS_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/terraform-docs"
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP/terraform-docs" terraform-docs
          echo "$RUNNER_TEMP/terraform-docs" >> "$GITHUB_PATH"

      # tflint 的 aws ruleset，由 scripts/validate.sh 的 tflint --init 安裝。
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/tflint-plugins
          key: tflint-plugins-${{ runner.os }}-${{ hashFiles('.tflint.hcl') }}

      - name: Validate
        env:
          # owners team token（Personal 方案不能建唯讀 team），30 天到期。只給這一步。
          # 風險與補償措施見 docs/guides/hcp-registry-setup.md〈CI 的 token〉。
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_APP_TERRAFORM_IO }}
          # tflint --init 從 GitHub 下載 aws ruleset；不給 token 時跟同一個 runner IP 共用每小時 60 次的匿名額度。
          GITHUB_TOKEN: ${{ github.token }}
        # PR 只驗證改動影響得到的目錄（改到共用檔案時仍是全部）；push、排程、手動觸發一律全量。
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            scripts/validate.sh --shard "${{ matrix.shard }}/4" --changed-since HEAD^1
          else
            scripts/validate.sh --shard "${{ matrix.shard }}/4"
          fi

      - name: Registry versions
        if: always()
        run: |
          {
            echo "### Module versions resolved from the registry by the template stacks"
            echo
            echo "| template | module | version | stacks |"
            echo "|---|---|---|---|"
            for mj in .cache/tf-data/templates__*__infra__terraform__*/modules/modules.json; do
              [ -f "$mj" ] || continue
              dir="$(basename "$(dirname "$(dirname "$mj")")")"
              tpl="${dir#templates__}"
              tpl="${tpl%%__infra__terraform__*}"
              jq -r --arg t "$tpl" --arg s "${dir##*__}" '.Modules[] | select(.Version) | "\($t)\t\(.Source | split("/")[2])\t\(.Version)\t\($s)"' "$mj"
            done | sort | awk -F'\t' '
              { k = $1 "\t" $2 "\t" $3; if (!(k in s)) { o[++n] = k; s[k] = $4 } else { s[k] = s[k] " " $4 } }
              END { for (i = 1; i <= n; i++) { split(o[i], a, "\t"); print "| " a[1] " | `" a[2] "` | " a[3] " | " s[o[i]] " |" } }'
          } >>"$GITHUB_STEP_SUMMARY"

  # Single result for the PR page and for any future required status check.
  validate:
    needs: validate-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All shards passed
        run: |
          echo "shards: ${{ needs.validate-shard.result }}"
          [ "${{ needs.validate-shard.result }}" = success ]
