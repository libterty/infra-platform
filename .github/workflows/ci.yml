name: CI

# 不給任何雲端憑證。範本的 stack 從 HCP private registry 引用 module（ADR-0004），所以 Validate 這一步讀 repo secret
# TF_TOKEN_APP_TERRAFORM_IO；fork 來的 PR 拿不到 secret，範本的 stack 會在 init 失敗。
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 1 * * 1" # 每週一 01:17 UTC：registry 與 token 是否還能用
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.15.8"
  TFLINT_VERSION: "v0.64.0"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/plugins
          key: tf-plugins-${{ runner.os }}-${{ hashFiles('**/versions.tf', '**/.terraform.lock.hcl') }}
          restore-keys: tf-plugins-${{ runner.os }}-

      - name: Validate
        env:
          # owners team token（Personal 方案不能建唯讀 team），30 天到期。只給這一步。
          # 風險與補償措施見 docs/guides/hcp-registry-setup.md〈CI 的 token〉。
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_APP_TERRAFORM_IO }}
        run: scripts/validate.sh

      - name: Registry versions
        if: always()
        run: |
          {
            echo "### Module versions resolved from the registry by the template stacks"
            echo
            echo "| module | version | stacks |"
            echo "|---|---|---|"
            for mj in .cache/tf-data/templates__project-infra__infra__terraform__*/modules/modules.json; do
              [ -f "$mj" ] || continue
              stack="$(basename "$(dirname "$(dirname "$mj")")")"
              jq -r --arg s "${stack##*__}" '.Modules[] | select(.Version) | "\(.Source | split("/")[2])\t\(.Version)\t\($s)"' "$mj"
            done | sort | awk -F'\t' '
              { k = $1 "\t" $2; if (!(k in s)) { o[++n] = k; s[k] = $3 } else { s[k] = s[k] " " $3 } }
              END { for (i = 1; i <= n; i++) { split(o[i], a, "\t"); print "| `" a[1] "` | " a[2] " | " s[o[i]] " |" } }'
          } >>"$GITHUB_STEP_SUMMARY"
