name: Registry

# 驗證範本複製出去、改成 HCP registry 寫法之後，用已發佈的 module 版本還能 init 與 validate（ADR-0004）。
# 跟 CI 分開：這個 workflow 要讀 HCP 的 token，所以不在 pull_request 跑，PR 的程式碼碰不到 secret。
# 範本跟 module 一起改的 PR 合併之後、新版 tag 打出來之前，這裡會是紅的，代表「現在複製範本出去會用到還沒發佈的版本」。
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 1 * * 1" # 每週一 01:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.15.8"
  REGISTRY: app.terraform.io/libterty

jobs:
  template-against-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/plugins
          key: tf-plugins-${{ runner.os }}-${{ hashFiles('**/versions.tf', '**/.terraform.lock.hcl') }}
          restore-keys: tf-plugins-${{ runner.os }}-

      - name: Check the template against the registry
        env:
          # owners team token（Personal 方案不能建唯讀 team），30 天到期。只給這一步，不寫進任何檔案。
          # 風險與補償措施見 docs/guides/hcp-registry-setup.md〈本 repo 的 Registry workflow〉。
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_APP_TERRAFORM_IO }}
        run: |
          if [ -z "${TF_TOKEN_app_terraform_io}" ]; then
            echo "Secret TF_TOKEN_APP_TERRAFORM_IO is not set; skipped." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          scripts/check-template-registry.sh "$REGISTRY"
