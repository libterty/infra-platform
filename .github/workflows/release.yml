name: Release

# release-please 開各 module 的 release PR，PR 合併後打 <module>-v<semver> tag。
# 需要 Settings → Actions → General 允許 Actions 建立 PR（2026-10-21 已開）。
# 這個 workflow 用 GITHUB_TOKEN 開 PR，所以 release PR 不會觸發 CI。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # contents: write 只給這個 job。
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
