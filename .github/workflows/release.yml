name: Release

# release-please 開各 module 的 release PR，PR 合併後打 <module>-v<semver> tag。
# 目前只手動觸發：repo 還沒允許 GitHub Actions 開 PR，push 觸發只會失敗並留下 release 分支。
# 要交給 release-please 發版時，先在 Settings → Actions → General 允許 Actions 建立 PR，再把 push 觸發加回來。
on:
  workflow_dispatch:

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # contents: write 只給這個 job。
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
